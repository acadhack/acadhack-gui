name: Build Windows Executable

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Display Python version
        run: |
          python -c "import sys; print(f'Python {sys.version}')"
          python -m pip --version
      
      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip setuptools wheel
      
      - name: Verify project structure
        run: |
          echo "Checking project structure..."
          if (-not (Test-Path "app_webview.py")) { exit 1 }
          if (-not (Test-Path "web")) { exit 1 }
          if (-not (Test-Path "requirements_windows.txt")) { exit 1 }
          if (-not (Test-Path "app_webview.spec")) { exit 1 }
          if (-not (Test-Path "build_windows.py")) { exit 1 }
          if (-not (Test-Path "rthook_pyside6_qtplugins.py")) { exit 1 }
          echo "[+] All required files found"
          Get-ChildItem -Recurse
      
      - name: Debug - Check File Structure
        shell: cmd
        run: |
          echo "Current Directory: %CD%"
          if exist web ( echo Web folder found ) else ( echo Web folder MISSING )
          dir web
      
      - name: Install dependencies
        run: |
          echo "Installing from requirements_windows.txt..."
          python -m pip install -r requirements_windows.txt
          echo "PyInstaller version:"
          python -m PyInstaller --version
      
      - name: Build Windows executable
        run: |
          echo "Starting build..."
          python build_windows.py
      
      - name: Verify build output
        run: |
          echo "Verifying build output..."
          if (-not (Test-Path "dist/app_webview/app_webview.exe")) {
            echo "ERROR: Executable not found"
            exit 1
          }
          if (-not (Test-Path "dist/app_webview/web")) {
            echo "ERROR: web folder not found"
            exit 1
          }
          echo "[+] Build verification passed"
          echo "Executable info:"
          Get-Item "dist/app_webview/app_webview.exe" | Select-Object FullName, Length
          echo "Contents of dist/app_webview:"
          Get-ChildItem "dist/app_webview" -Recurse | Select-Object FullName | Select-Object -First 50
      
      - name: Debug - List Dist Content
        shell: cmd
        run: |
          echo Listing Dist folder...
          dir dist /s
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app_webview-windows
          path: dist/app_webview/
          retention-days: 30
          compression-level: 6
      
      - name: Create release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/app_webview/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "======================================="
          echo "BUILD SUMMARY"
          echo "======================================="
          if (Test-Path "dist/app_webview/app_webview.exe") {
            echo "[+] Build Status: SUCCESS"
            $fileSize = (Get-Item "dist/app_webview/app_webview.exe").Length / 1MB
            echo "[+] Executable Size: $($fileSize.ToString('F2')) MB"
            echo "[+] Output: dist/app_webview/"
            echo ""
            echo "Artifact ready for download from GitHub Actions"
          } else {
            echo "[!] Build Status: FAILED"
            exit 1
          }
