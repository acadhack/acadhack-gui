name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r acadhack-gui/requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      working-directory: acadhack-gui
      run: |
        pyinstaller app_webview.spec

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AcadHack-Windows-v1.2.0
        path: acadhack-gui/dist/AcadHack.exe
